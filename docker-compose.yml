version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: campusconnect-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: campusconnect
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - campusconnect-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: campusconnect-ai-service
    restart: always
    environment:
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - '8000:8000'
    networks:
      - campusconnect-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/campusconnect
      JWT_SECRET: campusconnect_jwt_production_secret_key_super_secure_9922
      JWT_REFRESH_SECRET: campusconnect_jwt_production_refresh_secret_key_8833
      FASTAPI_SERVICE_URL: http://ai-service:8000/api/v1
      CLIENT_ORIGIN: http://localhost:80
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - uploads-data:/app/uploads
    networks:
      - campusconnect-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusconnect-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - campusconnect-network

networks:
  campusconnect-network:
    driver: bridge

volumes:
  mongo-data:
  uploads-data:
